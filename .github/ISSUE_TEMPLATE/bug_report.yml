name: Bug 反馈
description: 报一个 bug（崩溃 / 样式 / 行为 / 兼容 / 性能）
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请先在 [Issues](https://github.com/Witherwithwinter/DSH-Codinput/issues?q=is%3Aissue) 搜一下是否已有人报过。
        如果方便，用 `/codinput` 退出接管对比一次：问题消失说明与接管有关，仍在说明来自宿主或其它插件。

  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 崩溃 / 报错
        - 样式 / 布局
        - 交互 / 行为
        - 其它插件座位兼容（按钮 / 面板消失、错位）
        - 性能（卡顿 / 掉帧）
        - 其它
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Codinput 版本、宿主版本、平台（桌面 / web）、运行形态（普通 / 悬浮 / 侧栏 / 已退出接管）
      placeholder: Codinput 0.5.0 / 宿主 0.2.2-rc.3 / 桌面版 / 普通形态
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始写；能稳定复现的步骤比文字描述有用
      placeholder: |
        1. 新建会话
        2. 发送一条带图片的消息
        3. 切到侧栏形态
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 实际现象 / 期望行为
      placeholder: |
        实际：切到侧栏后图片气泡消失
        期望：侧栏仍显示图片
    validations:
      required: true

  - type: textarea
    id: plugins
    attributes:
      label: 其它已启用的插件（兼容类问题必填）
      description: 列出第三方插件即可，不必精确到版本
      placeholder: |
        - dsh-context
        - @knyazevai/dsh-client-ui-attachment

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 控制台报错（可选）
      description: 界面类问题尽量带图；控制台（F12）红色报错或 `window.__dshCodinputErrs` 输出也可直接贴
